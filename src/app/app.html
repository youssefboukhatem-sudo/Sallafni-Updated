<a class="skip" href="#main">Skip to content</a>

<!-- Icon sprite -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-tool" viewBox="0 0 48 48"><path d="M8 14h24a4 4 0 0 1 4 4v4H12l-4-4zM14 22v16a3 3 0 0 0 3 3h4a3 3 0 0 0 3-3V22M36 18h6"/></symbol>
  <symbol id="i-tent" viewBox="0 0 48 48"><path d="M4 40L24 8l20 32zM24 8v32M16 40l8-14 8 14"/></symbol>
  <symbol id="i-bike" viewBox="0 0 48 48"><circle cx="11" cy="32" r="8"/><circle cx="37" cy="32" r="8"/><path d="M11 32l8-16h10l8 16M19 16l10 16M27 12h6"/></symbol>
  <symbol id="i-device" viewBox="0 0 48 48"><rect x="8" y="6" width="32" height="36" rx="4"/><path d="M20 36h8"/></symbol>
  <symbol id="i-bbq" viewBox="0 0 48 48"><path d="M6 20h36a18 14 0 0 1-36 0zM16 34l-5 10M32 34l5 10M24 34v10"/></symbol>
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></symbol>
  <symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></symbol>
</svg>

<header class="topbar">
  <a class="brand" routerLink="/" aria-label="Sallafni home">sallafni</a>
  <form class="search" role="search" (submit)="search($event)">
    <svg class="ico" aria-hidden="true"><use href="#i-search"/></svg>
    <label for="q" class="sr">Search items</label>
    <input id="q" type="search" placeholder="Tools, bikes, party gear…" [value]="store.query()" (input)="store.query.set($any($event.target).value)">
  </form>
  <nav aria-label="Main">
    <a routerLink="/borrower" routerLinkActive ariaCurrentWhenActive="page">Borrow</a>
    <a routerLink="/lender" routerLinkActive ariaCurrentWhenActive="page">Lend</a>
    @if (store.user(); as u) {
      <a routerLink="/profile" routerLinkActive ariaCurrentWhenActive="page">
        @if (u.avatar) { <img class="nav-avatar" [src]="u.avatar" alt="" /> } @else { <span class="nav-initial" aria-hidden="true">{{ store.displayName()[0].toUpperCase() }}</span> }
        Profile
      </a>
      <button type="button" class="navbtn" (click)="logout()">Log out</button>
    } @else {
      <a routerLink="/login" class="iconbtn" aria-label="Log in" routerLinkActive ariaCurrentWhenActive="page"><svg class="ico" aria-hidden="true"><use href="#i-user"/></svg></a>
    }
  </nav>
</header>

<main id="main">
  <router-outlet />
</main>
<footer class="foot">© 2026 Sallafni · Why buy it when you can borrow it. · Student project.</footer>
