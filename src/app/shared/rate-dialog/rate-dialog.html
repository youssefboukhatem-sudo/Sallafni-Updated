<dialog #dlg aria-labelledby="rateTitle">
  <form (submit)="submit($event)" novalidate>
    <h2 id="rateTitle">Rate {{ target()?.name }}</h2>
    <fieldset class="scale">
      <legend>Score from 1 (poor) to 10 (excellent)</legend>
      <div class="nums">
        @for (n of scores; track n) {
          <label><input type="radio" name="score" [value]="n" [checked]="selected() === n" (change)="selected.set(n)" /><span>{{ n }}</span></label>
        }
      </div>
    </fieldset>
    @if (showError()) { <p class="error" role="alert">Choose a score from 1 to 10.</p> }
    <div class="field">
      <label for="rcomment">Comment (optional)</label>
      <input id="rcomment" maxlength="140" [value]="comment()" (input)="comment.set($any($event.target).value)" />
    </div>
    @if (serverError()) { <p class="error" role="alert">{{ serverError() }}</p> }
    <div class="row end">
      <button type="button" class="btn btn-small btn-outline" (click)="close()">Cancel</button>
      <button class="btn btn-primary" type="submit" [disabled]="busy()">Submit rating</button>
    </div>
  </form>
</dialog>
