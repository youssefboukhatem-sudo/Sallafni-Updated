<section class="view active" id="borrower">
  <div class="page-head"><div><h1>Find something to borrow</h1><p class="muted">Items from neighbors near you.</p></div></div>

  <div class="filters">
    <div class="field">
      <label for="fcat">Category</label>
      <select id="fcat" [value]="store.category()" (change)="store.category.set($any($event.target).value)">
        <option value="">All</option>
        @for (c of categories; track c) { <option [value]="c">{{ c }}</option> }
      </select>
    </div>
    <div class="field price-field">
      <label id="price-label">Price per day</label>
      <div class="range" role="group" aria-labelledby="price-label" [style.--lo.%]="pct(store.priceFrom())" [style.--hi.%]="pct(store.priceTo())">
        <div class="range-track"></div>
        <div class="range-fill"></div>
        <input type="range" [min]="store.priceFloor" [max]="store.priceCeil()" step="1" [value]="store.priceFrom()"
               aria-label="Minimum price per day" [attr.aria-valuetext]="priceWord(store.priceFrom())" (input)="setMin($event)" />
        <input type="range" [min]="store.priceFloor" [max]="store.priceCeil()" step="1" [value]="store.priceTo()"
               aria-label="Maximum price per day" [attr.aria-valuetext]="priceWord(store.priceTo())" (input)="setMax($event)" />
      </div>
      <p class="range-out" aria-live="polite">
        <strong>{{ priceText() }}</strong>
        @if (store.priceFrom() > store.priceFloor || store.priceTo() < store.priceCeil()) {
          <button type="button" class="link" (click)="store.resetPrice()">Reset</button>
        }
      </p>
    </div>
  </div>

  <div class="grid-items">
