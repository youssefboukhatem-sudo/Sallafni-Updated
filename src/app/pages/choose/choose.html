<section class="view active">
  <div class="choose">
    <h1>What would you like to do today?</h1>
    <p class="muted">You can switch at any time from the top menu.</p>
    <div class="choices">
      <a class="card choice" routerLink="/borrower">
        <svg class="ico-lg" aria-hidden="true"><use href="#i-search" /></svg>
        <h2>Borrow something</h2>
        <p>Find tools, gear and more from neighbors close to you.</p>
      </a>
      <a class="card choice" routerLink="/lender">
        <svg class="ico-lg" viewBox="0 0 48 48" aria-hidden="true"><use href="#i-tool" /></svg>
        <h2>Lend something</h2>
        <p>List your items and accept requests from neighbors.</p>
      </a>
    </div>
  </div>
</section>
